<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Build log editor</title>
<style>
body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#EDEFEC;color:#1B2226}main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:.3em 0}button,select,input,textarea{font:inherit}button{padding:8px 14px;border:2px solid #1B2226;background:#F8F9F7;cursor:pointer}
button.pri{background:#1B2226;color:#fff}button.del{border-color:#9A5B1E;color:#9A5B1E}
input,select,textarea{width:100%;box-sizing:border-box;padding:8px;border:2px solid #B9C1C3;background:#fff;margin:4px 0}
fieldset{border:2px solid #1B2226;background:#F8F9F7;margin:14px 0;padding:10px}legend{font-weight:700}legend span{margin-left:8px}legend button{padding:2px 8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:2px solid #1B2226;padding:10px 0}.tb button{padding:2px 10px;margin-right:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}small{color:#5B676C}.bar{position:sticky;bottom:0;background:#EDEFEC;padding:10px 0}
</style></head><body><main id="app"></main>
<script>
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let tok=localStorage.gh||'',cfg=JSON.parse(localStorage.ghcfg||'null')||{o:location.hostname.replace('.github.io',''),r:location.pathname.split('/')[1]||'portfolio',b:'main'},posts=[],sha='',post=null,idx=-1,slugs=[];
const u8=s=>btoa(unescape(encodeURIComponent(s))),d8=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const gh=(p,o={})=>fetch(`https://api.github.com/repos/${cfg.o}/${cfg.r}/contents/${p}`,{...o,headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
function login(msg){app.innerHTML=`<h1>Build log editor</h1><p>${esc(msg||'')}</p><p>Paste a GitHub fine-grained token limited to this repo (Contents: read and write). It is stored only in this browser.</p>
<input id="t" type="password" placeholder="Token"><div class="two"><input id="o" value="${esc(cfg.o)}" placeholder="GitHub user"><input id="r" value="${esc(cfg.r)}" placeholder="Repo"></div><input id="b" value="${esc(cfg.b)}" placeholder="Branch">
<p><button class="pri" onclick="signin()">Sign in</button></p>`}
function signin(){tok=t.value.trim();cfg={o:o.value.trim(),r:r.value.trim(),b:b.value.trim()||'main'};localStorage.gh=tok;localStorage.ghcfg=JSON.stringify(cfg);load()}
function logout(){localStorage.removeItem('gh');tok='';login()}
async function load(){if(!tok)return login();const r=await gh('blog/posts.json?ref='+cfg.b);if(r.status===401||r.status===403)return login('Token rejected');
 if(r.status===404){posts=[];sha=''}else{const j=await r.json();posts=JSON.parse(d8(j.content));sha=j.sha}
 try{slugs=[...(await (await fetch('data/content.js')).text()).matchAll(/slug:\s*"([^"]+)"/g)].map(m=>m[1])}catch(e){}list()}
async function put(msg){const r=await gh('blog/posts.json',{method:'PUT',body:JSON.stringify({message:msg,content:u8(JSON.stringify(posts,null,1)),sha:sha||undefined,branch:cfg.b})});
 if(!r.ok)throw new Error(r.status===409||r.status===422?'The file changed elsewhere. Reload and try again.':'Save failed ('+r.status+')');sha=(await r.json()).content.sha}
async function up(file,dir){let name=Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_'),data;
 if(/^image\/(jpeg|png|webp)/.test(file.type)){const bm=await createImageBitmap(file),k=Math.min(1,2400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',.85).split(',')[1];name=name.replace(/\.\w+$/,'.jpg')}
 else data=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(file)});
 const path=dir+'/'+name,r=await gh(path,{method:'PUT',body:JSON.stringify({message:'Upload '+name,content:data,branch:cfg.b})});if(!r.ok)throw new Error('Upload failed ('+r.status+')');return path}
function list(){idx=-1;app.innerHTML=`<h1>Build log editor</h1><p><button class="pri" onclick="edit(-1)">New post</button> <button onclick="load()">Reload</button> <button onclick="logout()">Sign out</button></p>`+
 (posts.length?posts.map((p,i)=>[p,i]).sort((a,b)=>b[0].date.localeCompare(a[0].date)).map(([p,i])=>`<div class="row"><div><b>${esc(p.title)}</b>${p.draft?' <i>(draft)</i>':''}<br><small>${p.date} | ${esc(p.project)}</small></div><div><button onclick="edit(${i})">Edit</button> <button class="del" onclick="del(${i})">Delete</button></div></div>`).join(''):'<p>No posts yet.</p>')}
async function del(i){if(!confirm('Delete "'+posts[i].title+'"? It can be restored from GitHub history.'))return;const p=posts.splice(i,1)[0];try{await put('Delete post: '+p.title)}catch(e){alert(e.message);return load()}list()}
function edit(i){idx=i;post=i<0?{project:slugs[0]||'',date:new Date().toISOString().slice(0,10),title:'',draft:true,blocks:[]}:JSON.parse(JSON.stringify(posts[i]));form()}
const N={p:'Paragraph',h:'Heading',list:'List',img:'Image',video:'Video (YouTube/Vimeo link)',model:'3D model (.glb)'};
const sel=(i,k,v,o)=>`<select data-i="${i}" data-k="${k}">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
const BODY={
 p:(b,i)=>`<div class="tb"><button onclick="wrap(${i},'b')"><b>B</b></button><button onclick="wrap(${i},'i')"><i>I</i></button><button onclick="wrap(${i},'a')">Link</button></div><textarea rows="5" data-i="${i}" data-k="x">${esc(b.x)}</textarea>`,
 h:(b,i)=>`<input data-i="${i}" data-k="x" value="${esc(b.x)}">`,
 list:(b,i)=>`<textarea rows="4" data-i="${i}" data-k="items" placeholder="One item per line">${esc((b.items||[]).join('\n'))}</textarea>`,
 img:(b,i)=>`${b.src?`<img src="${esc(b.src)}" height="70"> `:''}<input type="file" accept="image/*" onchange="pick(${i},this,'images/blog')"><div class="two"><label>Layout ${sel(i,'layout',b.layout||'break',['break','left','right'])}</label><label>Align (break) ${sel(i,'align',b.align||'left',['left','center','right'])}</label></div>
  <div class="two"><input data-i="${i}" data-k="w" placeholder="Width, e.g. 40% or 400px" value="${esc(b.w)}"><input data-i="${i}" data-k="caption" placeholder="Caption" value="${esc(b.caption)}"></div><input data-i="${i}" data-k="alt" placeholder="Alt text" value="${esc(b.alt)}">`,
 video:(b,i)=>`<input data-i="${i}" data-k="url" placeholder="Paste a YouTube or Vimeo link" value="${esc(b.url)}"><input data-i="${i}" data-k="w" placeholder="Width, e.g. 70%" value="${esc(b.w)}">`,
 model:(b,i)=>`${b.src?`<small>${esc(b.src)}</small> `:''}<input type="file" accept=".glb" onchange="pick(${i},this,'models')"><input data-i="${i}" data-k="w" placeholder="Width, e.g. 80%" value="${esc(b.w)}">`};
function form(){app.innerHTML=`<h1>${idx<0?'New':'Edit'} post</h1><div class="two"><label>Project<input data-f="project" list="pl" value="${esc(post.project)}"><datalist id="pl">${slugs.map(s=>`<option>${s}</option>`).join('')}</datalist></label><label>Date<input type="date" data-f="date" value="${post.date}"></label></div>
 <label>Title<input data-f="title" value="${esc(post.title)}"></label><label><input type="checkbox" style="width:auto" data-f="draft"${post.draft?' checked':''}> Draft (hidden from the site)</label>
 ${post.blocks.map((b,i)=>`<fieldset><legend>${N[b.t]} <span><button onclick="mv(${i},-1)">&uarr;</button><button onclick="mv(${i},1)">&darr;</button><button onclick="rm(${i})">&times;</button></span></legend>${BODY[b.t](b,i)}</fieldset>`).join('')}
 <p>Add: ${Object.keys(N).map(k=>`<button onclick="add('${k}')">${N[k].split(' (')[0]}</button>`).join(' ')}</p><div class="bar"><button class="pri" onclick="save()">Save</button> <button onclick="list()">Cancel</button></div>`}
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.f)post[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;else if(t.dataset.i!=null){const b=post.blocks[t.dataset.i];b[t.dataset.k]=t.dataset.k==='items'?t.value.split('\n').filter(Boolean):t.value}});
const add=t=>{post.blocks.push({t});form()},rm=i=>{post.blocks.splice(i,1);form()},mv=(i,d)=>{const j=i+d;if(j<0||j>=post.blocks.length)return;[post.blocks[i],post.blocks[j]]=[post.blocks[j],post.blocks[i]];form()};
function wrap(i,t){const ta=document.querySelector(`textarea[data-i="${i}"]`),s=ta.selectionStart,e=ta.selectionEnd,sl=ta.value.slice(s,e);
 ta.value=ta.value.slice(0,s)+(t==='a'?`<a href="${prompt('Link address')||'#'}">${sl||'link'}</a>`:`<${t}>${sl}</${t}>`)+ta.value.slice(e);post.blocks[i].x=ta.value}
async function pick(i,el,dir){if(!el.files[0])return;try{post.blocks[i].src=await up(el.files[0],dir);form()}catch(e){alert(e.message)}}
function conv(u){let m;if(m=u.match(/(?:youtu\.be\/|v=)([\w-]{11})/))return'https://www.youtube.com/embed/'+m[1];if(m=u.match(/vimeo\.com\/(\d+)/))return'https://player.vimeo.com/video/'+m[1];return u}
async function save(){if(!post.title||!post.project)return alert('Add a title and a project');post.blocks.forEach(b=>{if(b.t==='video')b.url=conv(b.url||'')});
 if(idx<0)posts.push(post);else posts[idx]=post;try{await put((idx<0?'Add':'Update')+' post: '+post.title);alert('Saved. It goes live in 1-2 minutes.');list()}catch(e){alert(e.message);load()}}
load();
</script></body></html>
